<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B99 Trading X | Naira Settlement Desk</title>
    <style>
        /* Zero external assets. Pure standard CSS optimized for low-bandwidth mobile networks */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            padding-bottom: 40px;
        }
        header {
            border-bottom: 1px solid #1f2937;
            background: #0b0f19;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 15px;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #3b82f6;
        }
        .logo span { color: #ffffff; }
        h1 { font-size: 28px; margin-bottom: 10px; color: #ffffff; text-align: center;}
        .desc { color: #9ca3af; font-size: 15px; margin-bottom: 25px; text-align: center; line-height: 1.4; }
        .widget {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 5px;
        }
        select, input {
            width: 100%;
            background-color: #0b0f19;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        select:focus, input:focus { border-color: #3b82f6; }
        .row { display: flex; gap: 10px; }
        .w-33 { width: 35%; }
        .w-66 { width: 65%; }
        .banner {
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #1f2937;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .banner-lbl { color: #9ca3af; }
        .banner-val { font-weight: bold; color: #60a5fa; font-family: monospace; }
        .crypto-box { position: relative; }
        .curr-sym {
            position: absolute;
            left: 12px;
            top: 12px;
            color: #9ca3af;
            font-weight: bold;
        }
        .read-box {
            padding-left: 30px;
            color: #34d399;
            font-weight: bold;
            font-family: monospace;
            background-color: rgba(11,15,25,0.5);
        }
        .btn {
            width: 100%;
            background-color: #25d366;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            white-space: normal;
            word-wrap: break-word;
        }
        .btn:hover { background-color: #128c7e; }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 11px;
            color: #6b7280;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <div style="max-width:600px; margin:0 auto; text-align:left;">
            <div class="logo">B99 Trading <span>X</span></div>
        </div>
    </header>

    <div class="container">
        <h1>Naira Settlement Desk</h1>
        <p class="desc">B99 Trading X over-the-counter order request calculator. Highly optimized, communication routing framework.</p>

        <div class="widget">
            <form onsubmit="sendToWhatsApp(event)">
                <div class="form-group">
                    <label>Requested Transaction Action</label>
                    <select id="tradeType" onchange="calculateTrade()">
                        <option value="sell">Sell Asset (Request Local Naira Settlement)</option>
                        <option value="buy">Buy Asset (Provide Local Naira Settlement)</option>
                    </select>
                </div>

                <div class="row form-group">
                    <div class="w-33">
                        <label>Asset Unit</label>
                        <select id="cryptoType" onchange="calculateTrade()">
                            <option value="BC">BC</option>
                            <option value="Tether">Tether</option>
                        </select>
                    </div>
                    <div class="w-66">
                        <label>Requested Volume</label>
                        <input id="cryptoAmount" type="number" step="any" placeholder="0.00" oninput="calculateTrade()">
                    </div>
                </div>

                <div class="banner">
                    <span class="banner-lbl">B99 Trading X Current Value:</span>
                    <span id="rateDisplay" class="banner-val">0.00</span>
                </div>

                <div class="form-group" style="margin-bottom:20px;">
                    <label>Estimated Value Manifest</label>
                    <div class="crypto-box">
                        <span class="curr-sym">₦</span>
                        <input id="fiatAmount" type="text" readonly class="read-box">
                    </div>
                </div>

                <button type="submit" class="btn">Talk to management via this link</button>
            </form>
        </div>

        <footer>
            <p>&copy; 2026 B99 Trading X. Formatted strictly as an informational peer-to-peer data layout.</p>
        </footer>
    </div>

    <script>
        // TARGET WHATSAPP PROTOCOL LINK
        const WHATSAPP_NUMBER = "2348100812113"; 

        // 🛠️ ADMIN CONTROL PANEL: Input your manually set rates per Dollar (\$) here
        const MY_MANUAL_RATES = {
            BC: {
                usdSpotPrice: 64200,      
                nairaPerDollar: 1350      
            },
            Tether: {
                usdSpotPrice: 1,          
                nairaPerDollar: 1350      
            }
        };

        function calculateTrade() {
            const tradeType = document.getElementById('tradeType').value; 
            const cryptoType = document.getElementById('cryptoType').value; 
            const cryptoAmount = parseFloat(document.getElementById('cryptoAmount').value) || 0;
            
            const spotUSD = MY_MANUAL_RATES[cryptoType].usdSpotPrice;
            const exchangeRate = MY_MANUAL_RATES[cryptoType].nairaPerDollar;
            
            const currentP2PPrice = spotUSD * exchangeRate;
            const totalNairaEst = cryptoAmount * currentP2PPrice;
            
            document.getElementById('rateDisplay').innerText = "₦" + currentP2PPrice.toLocaleString(undefined, {maximumFractionDigits: 2});
            document.getElementById('fiatAmount').value = totalNairaEst.toLocaleString(undefined, {maximumFractionDigits: 2});
        }

        function sendToWhatsApp(event) {
            event.preventDefault();
            const tradeType = document.getElementById('tradeType').value;
            const cryptoType = document.getElementById('cryptoType').value;
            const cryptoAmount = document.getElementById('cryptoAmount').value;
            const fiatAmount = document.getElementById('fiatAmount').value;
            
            const spotUSD = MY_MANUAL_RATES[cryptoType].usdSpotPrice;
            const exchangeRate = MY_MANUAL_RATES[cryptoType].nairaPerDollar;
            const currentP2PPrice = spotUSD * exchangeRate;
            const displayTradeType = tradeType.toUpperCase();

            if(!cryptoAmount || cryptoAmount <= 0) {
                alert("Please enter a valid amount.");
                return;
            }

            const message = `Hello, I want to submit a *${displayTradeType}* order request on B99 Trading X.%0A%0A` +
                            `*Asset:* ${cryptoType}%0A` +
                            `*Amount:* ${cryptoAmount} ${cryptoType}%0A` +
                            `*Desk Valuation Rate:* ₦${currentP2PPrice.toLocaleString()}%0A` +
                            `*Total Manifest Value:* ₦${fiatAmount}%0A%0A` +
                            `Please attend to my communications request right away.`;

            window.open(`https://wa.me{WHATSAPP_NUMBER}?text=${message}`, '_blank');
        }

        window.onload = () => { 
            calculateTrade(); 
        };
    </script>
</body>
</html>
