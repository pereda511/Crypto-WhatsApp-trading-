<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B99 Trading X | Live Desk</title>
    <style>
        /* Core Reset - Optimized for low-bandwidth 2G/3G mobile networks */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 10px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #1f2937;
            margin-bottom: 15px;
        }
        .logo { font-size: 20px; font-weight: bold; color: #3b82f6; }
        .logo span { color: #ffffff; }
        h1 { font-size: 22px; margin: 10px 0 5px; color: #ffffff; text-align: center; }
        .desc { color: #9ca3af; font-size: 13px; text-align: center; margin-bottom: 15px; line-height: 1.3; }
        
        /* Flattened static display board - Low CPU rendering */
        .rate-board {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .rate-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .rate-row:last-child { margin-bottom: 0; }
        .rate-val { font-weight: bold; color: #60a5fa; font-family: monospace; }

        /* Pure vertical stack form layout */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #9ca3af; margin-bottom: 4px; text-transform: uppercase; }
        select, input {
            width: 100%;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 6px;
            padding: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            display: block;
        }
        select:focus, input:focus { border-color: #3b82f6; }

        .payout-section {
            border-top: 1px dashed #1f2937;
            padding-top: 15px;
            margin-top: 15px;
        }
        .notice { font-size: 11px; color: #f59e0b; margin-bottom: 10px; display: block; }

        /* Solid low-data action buttons */
        .btn {
            width: 100%;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            display: block;
            margin-bottom: 10px;
            text-decoration: none;
        }
        .btn-wa { background-color: #25d366; }
        .btn-wa:hover { background-color: #1ea851; }
        
        /* Direct Action Button Style */
        .btn-tk { background-color: #3b82f6; font-size: 13px; padding: 12px; }
        .btn-tk:hover { background-color: #2563eb; }

        footer { text-align: center; margin-top: 25px; font-size: 11px; color: #6b7280; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">B99 Trading <span>X</span></div>
        </div>

        <h1>Naira Settlement Disbursement</h1>
        <p class="desc">Ultra-low network optimized. Secure local settlement lines.</p>

        <!-- Fixed Rate Panel -->
        <div class="rate-board">
            <div class="rate-row">
                <span>Buy Assets Desk:</span>
                <span class="rate-val">₦1,395 / $1.00</span>
            </div>
            <div class="rate-row">
                <span>Sell Assets Payout:</span>
                <span class="rate-val">₦1,350 / $1.00</span>
            </div>
        </div>

        <form onsubmit="executeOrder(event)">
            <div class="form-group">
                <label>Transaction Channel</label>
                <select id="tradeType" onchange="toggleFields();">
                    <option value="sell">Sell Asset (Receive Naira Payout)</option>
                    <option value="buy">Buy Asset (Pay via Naira)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Asset Portfolio</label>
                <select id="cryptoType">
                    <option value="BC Assets">BC Assets</option>
                    <option value="Tether Assets">Tether Assets</option>
                </select>
            </div>

            <div class="form-group">
                <label>Asset Volume ($ / USD)</label>
                <input id="cryptoAmount" type="number" step="any" placeholder="0.00">
            </div>

            <!-- Dynamic Bank Section -->
            <div id="payoutSection" class="payout-section">
                <span class="notice">⚠️ Account name must match your legal registration.</span>
                <div class="form-group">
                    <label>Bank Name</label>
                    <input id="bankName" type="text" placeholder="e.g., GTBank, Access, Zenith">
                </div>
                <div class="form-group">
                    <label>Account Number (10 Digits)</label>
                    <input id="accNumber" type="number" placeholder="0000000000" oninput="if(this.value.length > 10) this.value = this.value.slice(0,10);">
                </div>
                <div class="form-group">
                    <label>Account Holder Full Name</label>
                    <input id="accName" type="text" placeholder="As it appears on bank profile">
                </div>
            </div>

            <button type="submit" class="btn btn-wa">Complete Trade via WhatsApp</button>
            
            <!-- FIXED: Toggles embedded chat window instantly without opening a separate tab -->
            <button type="button" class="btn btn-tk" onclick="openLiveChat();">Access Live Chat Support Panel</button>
        </form>

        <footer>
            <p>Order Ref: <span id="sysRef" style="font-family: monospace; color: #60a5fa;">B99-GENERATING...</span></p>
            <p style="margin-top: 5px;">&copy; 2026 B99 Trading X. Data-Friendly Build.</p>
        </footer>
    </div>

    <script>
        const WHATSAPP_NUMBER = "2348100812113"; 
        const MY_MANUAL_RATES = {
            "BC Assets": { buy: 1395, sell: 1350 },
            "Tether Assets": { buy: 1395, sell: 1350 }
        };

        function generateRef() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let ref = 'B99-';
            for (let i = 0; i < 6; i++) { ref += chars.charAt(Math.floor(Math.random() * chars.length)); }
            document.getElementById('sysRef').innerText = ref;
            return ref;
        }

        function toggleFields() {
            const tradeType = document.getElementById('tradeType').value;
            document.getElementById('payoutSection').style.display = (tradeType === 'sell') ? 'block' : 'none';
        }

        function executeOrder(event) {
            event.preventDefault();
            const tradeType = document.getElementById('tradeType').value;
            const cryptoType = document.getElementById('cryptoType').value;
            const cryptoAmount = parseFloat(document.getElementById('cryptoAmount').value) || 0;
            
            const rate = MY_MANUAL_RATES[cryptoType][tradeType];
            const totalNairaValue = cryptoAmount * rate;
            const ref = document.getElementById('sysRef').innerText;

            if (cryptoAmount <= 0) {
                alert("Please enter a valid amount.");
                return;
            }

            let message = `*B99 TRADING SETTLEMENT*%0A` +
                          `Ref: ${ref}%0A` +
                          `Action: ${tradeType.toUpperCase()} ${cryptoType}%0A` +
                          `Volume: $${cryptoAmount.toLocaleString()}%0A` +
                          `Rate: ₦${rate.toLocaleString()}%0A` +
                          `Total Settlement Disbursement: ₦${totalNairaValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}%0A`;

            if (tradeType === 'sell') {
                const bank = document.getElementById('bankName').value.trim();
                const num = document.getElementById('accNumber').value.trim();
                const name = document.getElementById('accName').value.trim();

                if (!bank || !num || !name) {
                    alert("Please complete bank details.");
                    return;
                }
                message += `--- BANK INFO ---%0ABank: ${bank}%0AAcct No: ${num}%0AName: ${name}%0A`;
            }

            window.open(`https://wa.me/2348100812113?text=${message}`, '_blank');
            generateRef();
        }

        // NEW: Interface bridge to expand chat overlay inside the viewport frame
        function openLiveChat() {
            if (typeof Tawk_API !== 'undefined' && typeof Tawk_API.maximize === 'function') {
                Tawk_API.maximize();
            } else {
                alert("Live chat is initializing. Please wait a brief moment and try again.");
            }
        }

        window.onload = function() {
            toggleFields();
            generateRef();
        };
    </script>

                Tawk_API.show();
            }
        };
