    <script>
        // CONFIGURATION: Linked straight to your assigned peer endpoint
        const WHATSAPP_NUMBER = "2348100812113"; 

        // Raw system benchmarks reflecting CoinCola P2P Market baselines before operational adjustments
        let liveP2PRates = {
            BTC: 112528300,  
            USDT: 1360       
        };

        // Asynchronous structural layer to sync global market indicators
        async function fetchLiveRates() {
            try {
                const response = await fetch('https://coingecko.com');
                if (response.ok) {
                    const data = await response.json();
                    
                    // Base reference conversion factor mimicking primary localized indexes
                    const dynamicNairaMultiplier = 1365; 
                    
                    liveP2PRates.BTC = data.bitcoin.usd * dynamicNairaMultiplier;
                    liveP2PRates.USDT = dynamicNairaMultiplier; 
                    
                    calculateTrade();
                }
            } catch (error) {
                console.log("Maintaining internal secure P2P local storage margins", error);
            }
        }

        function calculateTrade() {
            const cryptoType = document.getElementById('cryptoType').value;
            const cryptoAmount = parseFloat(document.getElementById('cryptoAmount').value) || 0;
            
            // Extract the baseline network valuation parameters
            const rawMarketPrice = liveP2PRates[cryptoType];
            
            // MATHEMATICAL REQUIREMENT: Deduct absolute 0.50% operational desk fee margin from execution price
            const feeDeductionAmount = rawMarketPrice * 0.005;
            const operationalP2PPrice = rawMarketPrice - feeDeductionAmount;
            
            // Standard user multi-variable accumulation logic
            const totalNairaEst = cryptoAmount * operationalP2PPrice;
            
            // Map values directly back to client template layouts
            document.getElementById('rateDisplay').innerText = `₦${operationalP2PPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} / per ${cryptoType}`;
            document.getElementById('fiatAmount').value = totalNairaEst.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function sendToWhatsApp(event) {
            event.preventDefault();
            const tradeType = document.getElementById('tradeType').value.toUpperCase();
            const cryptoType = document.getElementById('cryptoType').value;
            const cryptoAmount = document.getElementById('cryptoAmount').value;
            const fiatAmount = document.getElementById('fiatAmount').value;
            
            const rawMarketPrice = liveP2PRates[cryptoType];
            const netPriceAfterCommission = rawMarketPrice - (rawMarketPrice * 0.005);
