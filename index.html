<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B99 Trading X | Live Desk</title>
    <style>
        /* Core Reset - Optimized for low-bandwidth 2G/3G mobile networks */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 10px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #1f2937;
            margin-bottom: 15px;
        }
        .logo { font-size: 20px; font-weight: bold; color: #3b82f6; }
        .logo span { color: #ffffff; }
        h1 { font-size: 22px; margin: 10px 0 5px; color: #ffffff; text-align: center; }
        .desc { color: #9ca3af; font-size: 13px; text-align: center; margin-bottom: 15px; line-height: 1.3; }
        
        /* Flattened static display board - Bold Text Enhancements */
        .rate-board {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .rate-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .rate-row:last-child { margin-bottom: 0; }
        .rate-label { font-weight: 500; color: #9ca3af; }
        .rate-val { font-weight: 900; color: #ffffff; font-size: 16px; font-family: monospace; }
        .rate-val mark { background: none; color: #3b82f6; font-weight: 900; }

        /* Dedicated Space for Advertisements */
        .adv-space {
            background: linear-gradient(45deg, #1e293b, #0f172a);
            border: 1px dashed #3b82f6;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }
        .adv-space a { color: #3b82f6; text-decoration: none; font-weight: bold; }

        /* Pure vertical stack form layout */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #9ca3af; margin-bottom: 4px; text-transform: uppercase; }
        select, input, textarea {
            width: 100%;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 6px;
            padding: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            display: block;
        }
        select:focus, input:focus, textarea:focus { border-color: #3b82f6; }

        .payout-section {
            border-top: 1px dashed #1f2937;
            padding-top: 15px;
            margin-top: 15px;
        }
        .notice { font-size: 11px; color: #f59e0b; margin-bottom: 10px; display: block; }

        /* Consumer Interactive Rating Component */
        .rating-box {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .stars-input { display: flex; gap: 8px; margin: 8px 0 12px; }
        .star-btn { 
            background: none; border: none; font-size: 24px; cursor: pointer; color: #4b5563; 
            transition: color 0.1s ease;
        }
        .star-btn.active { color: #f59e0b; }
        
        /* Testimonials Section with Seamless Animations */
        .testimonials-section {
            margin-top: 20px;
            border-top: 1px solid #1f2937;
            padding-top: 15px;
        }
        .testimonial-card {
            background: #111827;
            border-left: 3px solid #3b82f6;
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 10px;
            font-size: 13px;
            animation: slideIn 0.3s ease-out;
        }
        .t-author { display: block; font-weight: bold; font-size: 11px; color: #60a5fa; margin-top: 4px; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Solid low-data action buttons */
        .btn {
            width: 100%;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            display: block;
            margin-bottom: 10px;
            text-decoration: none;
        }
        .btn-wa { background-color: #25d366; }
        .btn-wa:hover { background-color: #1ea851; }
        .btn-submit-review { background-color: #3b82f6; font-size: 13px; padding: 10px 14px; border: none; transition: background 0.2s; }
        .btn-submit-review:hover { background-color: #2563eb; }
        .btn-tk { background-color: #1f2937; font-size: 13px; padding: 12px; border: 1px solid #374151; }
        .btn-tk:hover { background-color: #374151; }

        footer { text-align: center; margin-top: 25px; font-size: 11px; color: #6b7280; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">B99 Trading <span>X</span></div>
        </div>

        <!-- ADVERTISEMENT PANEL -->
        <div class="adv-space">
            📢 <strong>ADVERTISEMENT:</strong> Trade securely with zero hidden fees. <a href="#">Learn More &rarr;</a>
        </div>

        <h1>Naira Settlement Disbursement</h1>
        <p class="desc">Ultra-low network optimized. Secure local settlement lines.</p>

        <!-- Fixed Rate Panel -->
        <div class="rate-board">
            <div class="rate-row">
                <span class="rate-label">Buy Assets Desk:</span>
                <span class="rate-val"><mark>₦1,395</mark> / $1.00</span>
            </div>
            <div class="rate-row">
                <span class="rate-label">Sell Assets Payout:</span>
                <span class="rate-val"><mark>₦1,350</mark> / $1.00</span>
            </div>
        </div>

        <!-- Form Desk -->
        <form onsubmit="executeOrder(event)">
            <div class="form-group">
                <label>Transaction Channel</label>
                <select id="tradeType" onchange="toggleFields();">
                    <option value="sell">Sell Asset (Receive Naira Payout)</option>
                    <option value="buy">Buy Asset (Pay via Naira)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Asset Portfolio</label>
                <select id="cryptoType">
                    <option value="BC Assets">BC Assets</option>
                    <option value="Tether Assets">Tether Assets</option>
                </select>
            </div>

            <div class="form-group">
                <label>Asset Volume ($ / USD)</label>
                <input id="cryptoAmount" type="number" step="any" placeholder="0.00">
            </div>

            <!-- Dynamic Bank Section -->
            <div id="payoutSection" class="payout-section">
                <span class="notice">⚠️ Account name must match your legal registration.</span>
                <div class="form-group">
                    <label>Bank Name</label>
                    <input id="bankName" type="text" placeholder="e.g., GTBank, Access, Zenith">
                </div>
                <div class="form-group">
                    <label>Account Number (10 Digits)</label>
                    <input id="accNumber" type="number" placeholder="0000000000" oninput="if(this.value.length > 10) this.value = this.value.slice(0,10);">
                </div>
                <div class="form-group">
                    <label>Account Holder Full Name</label>
                    <input id="accName" type="text" placeholder="As it appears on bank profile">
                </div>
            </div>

            <button type="submit" class="btn btn-wa">Complete Trade via WhatsApp</button>
            <button type="button" class="btn btn-tk" onclick="openLiveChat();">Access Live Chat Support Panel</button>
        </form>

        <!-- CONSUMER INTERACTIVE RATING MODULE -->
        <div class="rating-box">
            <label>Rate Your Experience</label>
            <div class="stars-input" id="starsContainer">
                <button type="button" class="star-btn" onclick="setRating(1)">&starf;</button>
                <button type="button" class="star-btn" onclick="setRating(2)">&starf;</button>
                <button type="button" class="star-btn" onclick="setRating(3)">&starf;</button>
                <button type="button" class="star-btn" onclick="setRating(4)">&starf;</button>
                <button type="button" class="star-btn" onclick="setRating(5)">&starf;</button>
            </div>
            <div class="form-group">
                <input type="text" id="reviewerName" placeholder="Your Name" style="font-size: 13px; padding: 8px; margin-bottom:8px;">
                <textarea id="reviewText" rows="2" placeholder="Write a quick feedback..." style="font-size: 13px; padding: 8px; resize: none;"></textarea>
            </div>
            <button type="button" class="btn btn-submit-review" id="submitReviewBtn" onclick="submitReview()">Submit Feedback</button>
        </div>

        <!-- LIVE GLOBAL CONSUMER TESTIMONIALS DISPLAY -->
        <div class="testimonials-section">
            <label style="margin-bottom: 10px;">Recent Client Testimonies</label>
            <div id="testimonialsContainer">
                <!-- Fallback defaults show instantly while data stream syncs seamlessly -->
