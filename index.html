<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B99 Trading X | Premium Institutional Settlement Desk</title>
    <style>
        /* Modern CSS Variables & Reset Architecture */
        :root {
            --bg-main: #060b13;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --brand-blue: #3b82f6;
            --brand-green: #10b981;
            --brand-accent: #60a5fa;
            --border-color: #334155;
            --neon-glow: rgba(59, 130, 246, 0.15);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 60px;
            line-height: 1.5;
        }

        /* Top Security Header Navigation */
        header {
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-wrap {
            max-width: 650px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--brand-blue);
            letter-spacing: -0.5px;
        }

        .logo span { 
            color: var(--text-primary); 
        }

        .secure-badge {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--brand-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        h1 { 
            font-size: 26px; 
            font-weight: 800;
            margin-bottom: 6px; 
            color: var(--text-primary); 
            text-align: center;
            letter-spacing: -0.5px;
        }

        .desc { 
            color: var(--text-secondary); 
            font-size: 14px; 
            margin-bottom: 24px; 
            text-align: center; 
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Institutional Spread Board Layout */
        .spread-board {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .spread-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .spread-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .spread-rate {
            font-size: 18px;
            font-weight: 800;
            color: var(--brand-accent);
            font-family: monospace;
        }

        /* Centralized Trading Processing Engine Widget */
        .widget {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .form-group { 
            margin-bottom: 18px; 
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        select, input {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, input:focus { 
            border-color: var(--brand-blue); 
            box-shadow: 0 0 0 3px var(--neon-glow);
        }

        .row { 
            display: flex; 
            gap: 12px; 
        }
        
        /* Updated layout widths for clean responsive scaling */
        .w-33 { width: 35%; min-width: 120px; }
        .w-66 { width: 65%; flex-grow: 1; }

        /* Integrated Safe Real-Time Estimation Ledger Wrap */
        .calculator-block {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-top: 8px;
            margin-bottom: 18px;
        }

        .calc-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            padding: 4px 0;
        }

        .calc-label { color: var(--text-secondary); }
        .calc-value { font-weight: 700; font-family: monospace; }
        .calc-total { color: var(--brand-green); font-size: 18px; }

        /* System Verification Alerts */
        .compliance-notice {
            font-size: 12px;
            color: var(--text-secondary);
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.15);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 18px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        /* Payout Structural Dynamic Wrapper */
        .payout-section {
            border-top: 1px dashed var(--border-color);
            margin-top: 22px;
            padding-top: 18px;
        }

        /* Core Execution Channels Buttons */
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            width: 100%;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-whatsapp {
            background-color: #25d366;
        }

        .btn-whatsapp:hover { 
            background-color: #1ea851; 
        }

        .btn-tawk {
            background-color: var(--brand-blue);
            font-size: 14px;
            padding: 12px;
        }

        .btn-tawk:hover {
            background-color: #2563eb;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* CRITICAL FIXED FIXTURE: Mobile Layout Breathing Code */
        @media(max-width: 580px) {
            h1 { font-size: 22px; }
            .widget { padding: 16px; }
            .spread-rate { font-size: 15px; }
            .row {
                flex-direction: column;
                gap: 14px;
            }
            .w-33, .w-66 {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-wrap">
            <div class="logo">B99 Trading <span>X</span></div>
            <div class="secure-badge">🔒 256-Bit SSL Secured</div>
        </div>
    </header>

    <div class="container">
        <h1>Naira Settlement Disbursement</h1>
        <p class="desc">Secure, institutional-grade high-volume asset conversion panel. Trades lock securely via distributed settlement clearing lines.</p>

        <!-- Live Instant Spread Notice Board -->
        <div class="spread-board">
            <div class="spread-card">
                <div class="spread-label">Buy Assets Desk</div>
                <div class="spread-rate">₦1,395 / $1.00</div>
            </div>
            <div class="spread-card">
                <div class="spread-label">Sell Assets Payout</div>
                <div class="spread-rate">₦1,350 / $1.00</div>
            </div>
        </div>

        <div class="widget">
            <form onsubmit="executeOrderChannel(event)">
                <div class="form-group">
                    <label>Transaction Channel</label>
                    <select id="tradeType" onchange="togglePayoutFields(); calculateLedger();">
                        <option value="sell">Sell Asset (Receive Naira Transfer Payout)</option>
                        <option value="buy">Buy Asset (Disburse Funding via Naira)</option>
                    </select>
                </div>

                <div class="row form-group">
                    <div class="w-33">
                        <label>Asset Portfolio</label>
                        <select id="cryptoType" onchange="calculateLedger();">
                            <option value="BC Assets">BC Assets</option>
