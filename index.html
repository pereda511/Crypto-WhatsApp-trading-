<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B99 Trading X | Live Bybit P2P Naira Desk</title>
    <style>
        /* Zero external assets. Pure standard CSS optimized for low-bandwidth mobile networks */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            padding-bottom: 40px;
        }
        header {
            border-bottom: 1px solid #1f2937;
            background: #0b0f19;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 15px;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #3b82f6;
        }
        .logo span { color: #ffffff; }
        h1 { font-size: 28px; margin-bottom: 10px; color: #ffffff; text-align: center;}
        .desc { color: #9ca3af; font-size: 15px; margin-bottom: 25px; text-align: center; line-height: 1.4; }
        .widget {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 5px;
        }
        select, input {
            width: 100%;
            background-color: #0b0f19;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        select:focus, input:focus { border-color: #3b82f6; }
        .row { display: flex; gap: 10px; }
        .w-33 { width: 35%; }
        .w-66 { width: 65%; }
        .banner {
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #1f2937;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .banner-lbl { color: #9ca3af; }
        .banner-val { font-weight: bold; color: #60a5fa; font-family: monospace; }
        .crypto-box { position: relative; }
        .curr-sym {
            position: absolute;
            left: 12px;
            top: 12px;
            color: #9ca3af;
            font-weight: bold;
        }
        .read-box {
            padding-left: 30px;
            color: #34d399;
            font-weight: bold;
            font-family: monospace;
            background-color: rgba(11,15,25,0.5);
        }
        .btn {
            width: 100%;
            background-color: #25d366;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn:hover { background-color: #128c7e; }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 11px;
            color: #6b7280;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <div style="max-width:600px; margin:0 auto; text-align:left;">
            <div class="logo">B99 Trading <span>X</span></div>
        </div>
    </header>

    <div class="container">
        <h1>Live P2P Naira Desk</h1>
        <p class="desc">Real-time Bybit P2P live offer rate conversions. Highly optimized mobile data friendly instant execution model.</p>

        <div class="widget">
            <form onsubmit="sendToWhatsApp(event)">
                <div class="form-group">
                    <label>Transaction Type</label>
                    <select id="tradeType" onchange="calculateTrade()">
                        <option value="sell">Sell Crypto (Receive Naira Transfer)</option>
                        <option value="buy">Buy Crypto (Pay via Naira)</option>
                    </select>
                </div>

                <div class="row form-group">
                    <div class="w-33">
                        <label>Asset</label>
                        <select id="cryptoType" onchange="calculateTrade()">
                            <option value="BTC">BTC</option>
                            <option value="USDT">USDT</option>
                        </select>
                    </div>
                    <div class="w-66">
                        <label>Amount</label>
                        <input id="cryptoAmount" type="number" step="any" placeholder="0.00" oninput="calculateTrade()">
                    </div>
                </div>

                <div class="banner">
                    <span class="banner-lbl">Bybit P2P Live Offer:</span>
                    <span id="rateDisplay" class="banner-val">0.00</span>
                </div>

                <div class="form-group" style="margin-bottom:20px;">
                    <label>Estimated Naira Value</label>
                    <div class="crypto-box">
                        <span class="curr-sym">₦</span>
                        <input id="fiatAmount" type="text" readonly class="read-box">
                    </div>
                </div>

                <button type="submit" class="btn">Open WhatsApp Trade Link</button>
            </form>
        </div>

        <footer>
            <p>&copy; 2026 B99 Trading X. Optimized for ultra-low network performance bandwidth.</p>
        </footer>
    </div>

    <script>
        // TARGET WHATSAPP PROTOCOL LINK
        const WHATSAPP_NUMBER = "2348100812113"; 

        // 🛠️ ADMIN CONTROL PANEL: Change your custom Buy and Sell rates here at will
        const MY_MANUAL_RATES = {
            BTC: {
                buy: 111965658,  // Change what you charge users when they BUY Bitcoin from you
                sell: 110500000  // Change what you pay users when they SELL Bitcoin to you
            },
            USDT: {
                buy: 1365,       // Change what you charge users when they BUY USDT from you
                sell: 1345       // Change what you pay users when they SELL USDT to you
            }
        };

        function calculateTrade() {
            const tradeType = document.getElementById('tradeType').value; // 'buy' or 'sell'
            const cryptoType = document.getElementById('cryptoType').value; // 'BTC' or 'USDT'
            const cryptoAmount = parseFloat(document.getElementById('cryptoAmount').value) || 0;
            
            // Fetch your designated manual configuration rate instantly
            const currentP2PPrice = MY_MANUAL_RATES[cryptoType][tradeType];
            
            // Multiply directly against your chosen parameters
            const totalNairaEst = cryptoAmount * currentP2PPrice;
            
            document.getElementById('rateDisplay').innerText = "₦" + currentP2PPrice.toLocaleString(undefined, {maximumFractionDigits: 2});
            document.getElementById('fiatAmount').value = totalNairaEst.toLocaleString(undefined, {maximumFractionDigits: 2});
        }

        function sendToWhatsApp(event) {
            event.preventDefault();
            const tradeType = document.getElementById('tradeType').value;
            const cryptoType = document.getElementById('cryptoType').value;
            const cryptoAmount = document.getElementById('cryptoAmount').value;
            const fiatAmount = document.getElementById('fiatAmount').value;
            
            const currentP2PPrice = MY_MANUAL_RATES[cryptoType][tradeType];
            const displayTradeType = tradeType.toUpperCase();

            if(!cryptoAmount || cryptoAmount <= 0) {
                alert("Please enter a valid amount.");
                return;
            }

            // Message layout reflects your selected operational rates
            const message = `Hello, I want to *${displayTradeType}* Crypto on B99 Trading X.%0A%0A` +
                            `*Asset:* ${cryptoType}%0A` +
                            `*Amount:* ${cryptoAmount} ${cryptoType}%0A` +
                            `*Bybit P2P Live Rate:* ₦${currentP2PPrice.toLocaleString()}%0A` +
                            `*Total NGN:* ₦${fiatAmount}%0A%0A` +
                            `Please attend to my trade request right away.`;

            window.open(`https://wa.me{WHATSAPP_NUMBER}?text=${message}`, '_blank');
        }

        // Initialize display instantly on boot
        window.onload = () => { 
            calculateTrade(); 
        };
    </script>
</body>
</html>
